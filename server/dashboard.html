<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GB10 Cluster Display</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #03080c;
      color: #e6f1f5;
      font-family: Montserrat, Arial, sans-serif;
    }
    #stage { position: relative; width: 320px; height: 172px; }
    #screen {
      position: absolute;
      inset: 0;
      width: 320px;
      height: 172px;
      overflow: hidden;
      transform-origin: top left;
      background: #091a24;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .page { position: absolute; inset: 0; background: #091a24; }
    .page.hidden { visibility: hidden; }
    .band {
      position: absolute;
      left: 0; top: 0; right: 0;
      height: 22px;
      background: #172b3a;
      border-bottom: 1px solid #315568;
    }
    .title {
      position: absolute;
      left: 8px; top: 3px;
      color: #7de2d1;
      font-size: 13px;
      font-weight: 700;
      line-height: 16px;
    }
    .clock {
      position: absolute;
      right: 8px; top: 5px;
      color: #8ba8b7;
      font-size: 12px;
      line-height: 12px;
    }
    .panel {
      position: absolute;
      top: 28px;
      height: 140px;
      padding: 6px 8px;
      overflow: hidden;
      border: 1px solid #315568;
      border-radius: 4px;
      background: #172b3a;
      font-size: 12px;
      line-height: 15px;
      white-space: pre;
    }
    .host { width: 148px; }
    #head { left: 8px; }
    #worker { left: 164px; }
    #model-panel { left: 8px; width: 304px; }
    .host .name { color: #7de2d1; font-weight: 600; }
    .host .thr {
      display: none;
      margin-left: 6px;
      padding: 0 4px;
      border-radius: 3px;
      background: #ffc66d;
      color: #061018;
      font-weight: 700;
    }
    .host.thr .thr { display: inline; }
    .hero { font-size: 24px; font-weight: 700; line-height: 26px; color: #e6f1f5; }
    .hero-side { position: absolute; left: 74px; top: 46px; font-size: 16px; line-height: 18px; }
    .barrow { position: relative; height: 15px; }
    .barrow:first-of-type { margin-top: 4px; }
    .barlabel { position: absolute; left: 0; top: 1px; color: #8ba8b7; }
    .bartrack {
      position: absolute;
      left: 40px; top: 3px;
      width: 76px; height: 8px;
      border-radius: 4px;
      background: #254552;
      overflow: hidden;
    }
    .barfill { height: 100%; border-radius: 4px; background: #7de2d1; }
    .barvalue { position: absolute; right: 8px; top: 1px; font-weight: 600; }
    .meta { color: #8ba8b7; line-height: 12px; }
    .online { color: #8ee3a2; font-weight: 600; }
    .offline { color: #ff6b6b; font-weight: 600; }
    .modelname { position: absolute; right: 8px; top: 7px; color: #7de2d1; font-weight: 600; }
    #model-panel .barlabel { width: 80px; }
    #model-panel .bartrack { left: 88px; width: 168px; }
    .health { position: absolute; left: 150px; top: 34px; color: #e6f1f5; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Live mirror of the GB10 cluster LCD">
    <section id="screen" aria-live="polite">
      <div class="page" id="system-page">
        <div class="band"></div>
        <div class="title">SYSTEM LOAD</div>
        <div class="clock">--:--:--</div>
        <div class="panel host" id="head"></div>
        <div class="panel host" id="worker"></div>
      </div>
      <div class="page hidden" id="model-page">
        <div class="band"></div>
        <div class="title">MODEL INFERENCE</div>
        <div class="clock">--:--:--</div>
        <div class="panel" id="model-panel"></div>
      </div>
    </section>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const screen = document.getElementById('screen');
    const pages = [document.getElementById('system-page'), document.getElementById('model-page')];
    const hostEls = [document.getElementById('head'), document.getElementById('worker')];
    const clocks = document.querySelectorAll('.clock');
    const DEFAULT_PAGE_ROTATION_MS = 5000;
    const MIN_PAGE_ROTATION_MS = 1000;
    const MAX_PAGE_ROTATION_MS = 300000;
    let currentPage = 0;
    let pageRotationMs = DEFAULT_PAGE_ROTATION_MS;
    let pageTimer;

    function fitScreen() {
      const scale = Math.min((innerWidth - 24) / 320, (innerHeight - 24) / 172, 4);
      stage.style.width = `${320 * scale}px`;
      stage.style.height = `${172 * scale}px`;
      screen.style.transform = `scale(${scale})`;
    }

    function bar(label, pct, digits = 0) {
      const known = Number.isFinite(pct);
      const value = known ? pct.toFixed(digits) + '%' : '--';
      const color = pct >= 97 ? '#ff6b6b' : pct >= 90 ? '#ffc66d' : '#7de2d1';
      return `<div class="barrow"><span class="barlabel">${label}</span>` +
        `<span class="bartrack"><span class="barfill" style="width:${known ? Math.min(pct, 100) : 0}%;background:${color}"></span></span>` +
        `<span class="barvalue" style="color:${color}">${value}</span></div>`;
    }

    function hostHtml(name, value) {
      if (!value) return `<span class="name">${name}</span>\n--`;
      const thr = value.throttle_thermal === true || value.throttle_power_cap === true;
      const temp = Number.isFinite(value.temp_c) ? `${Math.round(value.temp_c)}C` : '--';
      const soc = Number.isFinite(value.cpu_temp_c) ? `${Math.round(value.cpu_temp_c)}C` : '--';
      const nvme = Number.isFinite(value.nvme_temp_c) ? `${Math.round(value.nvme_temp_c)}C` : '--';
      const cpu = Number.isFinite(value.cpu_usage_pct) ? `${Math.round(value.cpu_usage_pct)}%` : '--';
      const power = Number.isFinite(value.power_w) ? `${value.power_w.toFixed(1)}W` : '--';
      const est = Number.isFinite(value.power_sys_est_w) ? `est ${value.power_sys_est_w.toFixed(1)}W` : 'est --';
      const up = Number.isFinite(value.uptime_s) ? formatUptime(value.uptime_s) : '--';
      return `<span class="name">${name}</span><span class="thr">THR</span>\n` +
        `<span class="hero">${Number.isFinite(value.gpu_util_pct) ? Math.round(value.gpu_util_pct) : '--'}%</span>` +
        `<span class="hero-side">GPU ${temp}</span>\n` +
        bar('GPU', value.gpu_util_pct) + bar('RAM', value.mem_used_pct) + bar('DSK', value.root_used_pct) +
        `<div class="meta">${power} · ${est}\nSoC ${soc} · NVMe ${nvme}\nCPU ${cpu} · up ${up}</div>`;
    }

    function modelHtml(value) {
      const online = value.healthy === true;
      const state = online ? '<span class="online">MODEL ONLINE</span>' : '<span class="offline">MODEL DOWN</span>';
      if (!online) return `${state}\n--`;
      const name = typeof value.name === 'string' ? value.name : '';
      const ttft = Number.isFinite(value.ttft_ms) && Number.isFinite(value.ttft_p95_ms)
        ? `TTFT ${(value.ttft_ms / 1000).toFixed(1)}s · p95 ${(value.ttft_p95_ms / 1000).toFixed(1)}s`
        : 'TTFT --';
      const itl = Number.isFinite(value.itl_p95_ms) ? `ITL p95 ${Math.round(value.itl_p95_ms)}ms` : 'ITL p95 --';
      return `${state}<span class="modelname">${name}</span>\n` +
        `<span class="hero">${Number(value.generation_tps || 0).toFixed(1)}</span>` +
        `<span style="color:#8ba8b7"> tok/s out</span>\n` +
        `<span style="color:#8ba8b7">in ${Number(value.prompt_tps || 0).toFixed(1)} tok/s</span>` +
        `<div class="health">run ${Math.round(value.running || 0)} · wait ${Math.round(value.waiting || 0)}\n${ttft}\n${itl}</div>\n` +
        bar('KV cache', value.kv_pct, 1) + bar('Prefix hit', value.prefix_cache_hit_pct) +
        bar('Spec accept', value.spec_accept_pct);
    }

    function formatUptime(seconds) {
      const total = Math.floor(seconds);
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      if (days >= 2) return `${days}d`;
      if (hours >= 1) return `${hours + days * 24}h`;
      return `${minutes}m`;
    }

    function showPage(index) {
      currentPage = index;
      pages.forEach((page, pageIndex) => page.classList.toggle('hidden', pageIndex !== index));
    }

    function scheduleNextPage() {
      clearInterval(pageTimer);
      pageTimer = setInterval(() => showPage((currentPage + 1) % pages.length), pageRotationMs);
    }

    function nextPage() {
      showPage((currentPage + 1) % pages.length);
      scheduleNextPage();
    }

    function render(data) {
      const configuredRotation = Number(data.page_rotation_ms);
      const nextRotation = Number.isFinite(configuredRotation) &&
        configuredRotation >= MIN_PAGE_ROTATION_MS && configuredRotation <= MAX_PAGE_ROTATION_MS
        ? configuredRotation : DEFAULT_PAGE_ROTATION_MS;
      if (nextRotation !== pageRotationMs) {
        pageRotationMs = nextRotation;
        scheduleNextPage();
      }
      clocks.forEach(c => { c.textContent = data.updated || '--:--:--'; });
      hostEls[0].className = 'panel host' +
        (data.head && (data.head.throttle_thermal || data.head.throttle_power_cap) ? ' thr' : '');
      hostEls[1].className = 'panel host' +
        (data.worker && (data.worker.throttle_thermal || data.worker.throttle_power_cap) ? ' thr' : '');
      hostEls[0].innerHTML = hostHtml('HEAD', data.head);
      hostEls[1].innerHTML = hostHtml('WORKER', data.worker);
      document.getElementById('model-panel').innerHTML = modelHtml(data.model || {});
    }

    async function refresh() {
      try {
        const response = await fetch('/status', {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch {
        clocks.forEach(c => { c.textContent = '--:--:--'; });
      }
    }

    addEventListener('resize', fitScreen);
    screen.addEventListener('pointerup', nextPage);
    fitScreen();
    refresh();
    setInterval(refresh, 2000);
    scheduleNextPage();
  </script>
</body>
</html>
